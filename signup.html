<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles_zeroing.css">
    <link rel="stylesheet" href="css/styles.css">
    <script type="text/javascript" src="js/script.js" defer></script>
    <title>Sign Up</title>
</head>

<body>
    <div class="wrapper">
        <h1>Sign Up</h1>
        <p class="errors" id="error-message"></p>
        <form action="" id="form">
            <div class="input-field">
                <label for="firstname-input" class="label">
                    <img src="img/person_24dp_000000_FILL1_wght400_GRAD0_opsz24.svg" alt="">
                </label>
                <input class="input-line" type="text" name="firstname" id="firstname-input" placeholder="Firstname">
            </div>
            <div class="input-field">
                <label for="email-input" class="label">
                    <span>@</span>
                </label>
                <input class="input-line" type="email" name="email" id="email-input" placeholder="Email">
            </div>
            <div class="input-field">
                <label for="password-input" class="label">
                    <img src="img/lock_24dp_000000_FILL1_wght400_GRAD0_opsz24.svg" alt="">
                </label>
                <input class="input-line" type="password" name="password" id="password-input" placeholder="Password">
            </div>
            <div class="input-field">
                <label for="repeat-password-input" class="label">
                    <img src="img/lock_24dp_000000_FILL1_wght400_GRAD0_opsz24.svg" alt="">
                </label>
                <input class="input-line" type="password" name="repeat-password" id="repeat-password-input"
                    placeholder="Repeat password">
            </div>
            <button class="button" type="submit">Sign up</button>
        </form>
        <p class="login-link">Already have an Account?<a href="login.html"> Login</a></p>
    </div>
</body>

</html>
